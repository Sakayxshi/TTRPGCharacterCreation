# One command brings up MariaDB 13.1 with the whole database loaded:
#   docker compose up -d --wait
# Then run the security tests:
#   docker compose exec db bash /tests/security_tests.sh
# Start again from scratch (deletes all data):
#   docker compose down -v

services:
  db:
    image: ${MARIADB_IMAGE:-quay.io/mariadb-foundation/mariadb-devel:13.1}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      # 3307 on your machine, so it doesn't clash with a MariaDB you already run
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      # Every .sql file here runs once, in name order, when the container is first created
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
